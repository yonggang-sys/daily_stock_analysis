name: Breadth Probe (manual, temporary)

# 临时探针（2026-10-23）：验证 SinaBreadthFetcher 在 GitHub Actions runner 上可用。
# 只读、不产出任何报告、不碰 ci-reports 分支、不发飞书。验证完即从仓库删除。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 Probe market stats
        env:
          SINA_BREADTH_ENABLED: 'true'
        run: |
          python -u - <<'PY'
          import json, os, time

          from data_provider.base import DataFetcherManager

          print("SINA_BREADTH_ENABLED =", os.getenv("SINA_BREADTH_ENABLED"))

          t0 = time.monotonic()
          manager = DataFetcherManager()
          print("manager init %.2fs | preflight flag=%r | fetchers=%d" % (
              time.monotonic() - t0,
              getattr(manager, "_sina_breadth_preflight_enabled", None),
              len(manager._fetchers),
          ))

          fetcher = manager._get_sina_breadth_fetcher()
          print("getter ->", type(fetcher).__name__ if fetcher else None)

          for round_no in (1, 2):
              t1 = time.monotonic()
              stats = manager.get_market_stats(purpose="market_review:cn")
              elapsed = time.monotonic() - t1
              print("round%d elapsed=%.2fs stats=%s" % (
                  round_no, elapsed, json.dumps(stats, ensure_ascii=False)))
              assert stats, "market stats empty"
              assert stats.get("up_count", 0) + stats.get("down_count", 0) > 3000, stats
              assert stats.get("total_amount", 0) > 5000, stats

          # 非 cn 区域必须完全不启用前置源
          assert manager._get_sina_breadth_fetcher() is not None
          print("PROBE OK")
          PY

      - name: 🚦 Probe disabled switch
        env:
          SINA_BREADTH_ENABLED: 'false'
        run: |
          python -u - <<'PY'
          import os
          from data_provider.sina_breadth_fetcher import SinaBreadthFetcher
          print("is_enabled() =", SinaBreadthFetcher.is_enabled())
          assert SinaBreadthFetcher.is_enabled() is False
          assert SinaBreadthFetcher().get_market_stats() is None
          print("KILL SWITCH OK")
          PY
