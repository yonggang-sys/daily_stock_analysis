name: Sync upstream

# 目的：让 fork 与上游 ZhuLinsen/daily_stock_analysis 的同步无人值守。
#
# 上游与本仓最常见、也是唯一高频的冲突点是 .github/workflows 里的 runs-on 行
# （本仓钉 ubuntu-26.04，上游倾向 ubuntu-latest / ubuntu-24.04）。这类冲突
# 由 scripts/sync_upstream.sh 确定性地解决：只冲突在 runner 行时取上游完整版本、
# 再回注 26.04；一旦发现本仓自研补丁有被动过的风险，脚本会 abort 且不推送。
#
# 因此本 workflow 只做三件事：定时跑脚本、成功推 main、失败开 issue 叫人。
# 注意：用 GITHUB_TOKEN 推送不会触发其他 workflow（GitHub 的既定行为）。
# 本仓 ci.yml 只监听 pull_request，00-daily-analysis.yml 只监听 ci-trigger 路径，
# 所以推送 main 本来也不会误触发分析流水线，无需额外 PAT。

on:
  schedule:
    # 每天 06:30 北京时间（22:30 UTC）
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只试合并，不推送（结果留在 runner 上，仅用于验证脚本）"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: 合并上游并推送
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: 检出 main（需完整历史才能算 merge-base）
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装脚本依赖（pyyaml 用于 workflow 结构校验）
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: 配置 git 身份与 upstream 远端
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git remote -v | sed 's#//[^@]*@#//***@#'

      - name: 执行同步脚本
        id: sync
        env:
          PUSH: ${{ inputs.dry_run && '0' || '1' }}
          PYTHON: python
        run: |
          set -o pipefail
          bash scripts/sync_upstream.sh 2>&1 | tee /tmp/sync.log

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 上游同步结果"
            echo ""
            echo "- 触发方式：\`${{ github.event_name }}\`"
            echo "- PUSH：\`${{ inputs.dry_run && '0（dry run）' || '1' }}\`"
            echo "- 与上游的差距："
            echo '  ```'
            echo "  behind=$(git rev-list --count HEAD..upstream/main 2>/dev/null || echo '?')"
            echo "  ahead=$(git rev-list --count upstream/main..HEAD 2>/dev/null || echo '?')"
            echo '  ```'
            echo ""
            echo "#### 脚本输出（尾部 80 行）"
            echo '```text'
            tail -n 80 /tmp/sync.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时开 issue 提醒人工处理
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[auto-sync] 上游同步失败，需要人工处理"
          {
            echo "定时同步在 $(date -u '+%Y-%m-%d %H:%M UTC') 失败。仓库未被改动（脚本在推送前 abort）。"
            echo ""
            echo "运行日志：$RUN_URL"
            echo ""
            echo "常见原因与处理方式："
            echo ""
            echo "| 现象 | 含义 | 处理 |"
            echo "|---|---|---|"
            echo "| \`含本仓自定义改动（非 runner）\` | 上游动到了本仓打过补丁的 workflow | \`git merge upstream/main\` 手工合，注意保留 AI_TARGETS_USED 等补丁 |"
            echo "| \`不在 .github/workflows/\` | 上游动到了业务代码且与本地冲突 | 同上，按文件逐个看 |"
            echo "| \`自定义补丁校验未通过\` | 合并后补丁丢了（analyzer 熔断 / notification 摘要 / ai_targets） | 先把合并结果回滚，再手工挑拣 |"
            echo "| \`py_compile 通过\` 之外的其他报错 | 脚本环境问题 | 看日志，多为依赖缺失 |"
            echo ""
            echo '```text'
            tail -n 60 /tmp/sync.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } > /tmp/issue_body.md

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue_body.md
            echo "已追加评论到已有 issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue_body.md
          fi

      - name: 成功时关闭遗留的提醒 issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[auto-sync] 上游同步失败，需要人工处理"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "本次同步已成功，自动关闭。"
          done
