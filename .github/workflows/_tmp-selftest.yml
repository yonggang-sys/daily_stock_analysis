name: _tmp self-test

# 临时：验证 tests/test_check_ci_runners_eol.py 在 Linux（LF）上真能拦住行尾缺陷。
# 验证完即删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eol-regression:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 pytest
        run: python -m pip install --quiet --disable-pip-version-check pytest
      - name: 确认工作区是 LF
        run: |
          file .github/workflows/ci.yml
          python -c "import sys;d=open('.github/workflows/ci.yml','rb').read();print('CRLF',d.count(b'\r\n'),'LF',d.count(b'\n'))"
      - name: 跑行尾回归
        run: python -m pytest tests/test_check_ci_runners_eol.py -q --noconftest
      - name: 用真实 workflow 做一遍 --fix 冒烟（LF 环境）
        run: |
          cp .github/workflows/ci.yml /tmp/before.yml
          python scripts/check_ci_runners.py || true
          python scripts/check_ci_runners.py --fix || true
          git diff --stat
          python - <<'PY'
          import pathlib
          before = pathlib.Path('/tmp/before.yml').read_text()
          after = pathlib.Path('.github/workflows/ci.yml').read_text()
          assert len(before.splitlines()) == len(after.splitlines()), '行数变了'
          print('行数守恒:', len(after.splitlines()))
          PY
