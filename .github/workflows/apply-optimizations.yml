name: Apply Efficiency Optimizations

on:
  push:
    branches:
      - feature/efficiency-optimization
    paths:
      - 'scripts/apply_optimizations.py'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch'
        required: false
        default: 'feature/efficiency-optimization'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'feature/efficiency-optimization' }}
          fetch-depth: 0

      - name: Apply Phase 2-4 optimizations
        run: python3 scripts/apply_optimizations.py

      - name: Check and commit
        run: |
          if git diff --quiet; then
            echo "No changes - optimizations already applied"
          else
            git diff --stat
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Phase 2-4: efficiency optimizations"
            git push
          fi

      - name: Create PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'feature/efficiency-optimization',
              base: 'main'
            });
            if (prs.length > 0) {
              console.log(`PR already exists: ${prs[0].html_url}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Phase 2-4: Efficiency Optimizations',
                head: 'feature/efficiency-optimization',
                base: 'main',
                body: '## Phase 2-4 Efficiency Optimizations\n\n### Phase 2: ci_emit.py - Parallel Host Racing\n- Serial host fallback 20s x 4 = 80s worst case -> ThreadPoolExecutor parallel racing, 8s timeout, 12s cap\n\n### Phase 3: analyzer.py - 503/Quota Detection\n- is_rate_limit expanded for 503/Service Unavailable/overloaded/high demand\n- Quota check before non-stream retry\n\n### Phase 4: Workflow YAML\n- sleep 15s -> 5s, remove pip upgrade\n- GEMINI_REQUEST_DELAY: vars (default 0.5s)\n- MAX_WORKERS: default 3\n- GEMINI_API_KEYS multi-key support\n\n### Phase 1: Manual Config Required\n| Setting | Type | Value |\n|---------|------|-------|\n| MAX_WORKERS | Variables | 3 |\n| GEMINI_REQUEST_DELAY | Variables | 0.5 |\n| DEEPSEEK_API_KEY | Secrets | (your key) |\n| GEMINI_API_KEYS | Secrets | key1,key2,key3 |'
              });
              console.log(`PR created: ${pr.html_url}`);
            }
